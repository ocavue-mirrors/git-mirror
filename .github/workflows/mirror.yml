name: mirror

on:
  schedule:
    - cron: '33 19 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: ./mirror.sh
        env:
          # Expires on Sun, Sep 19 2027
          # https://github.com/settings/personal-access-tokens/19803042
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
