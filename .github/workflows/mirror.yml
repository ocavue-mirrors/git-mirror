name: mirror

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: ./mirror.sh
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
